name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m unittest discover -s tests

  windows:
    name: Windows (installer + portable zip)
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build_windows.ps1
      - name: Ensure installer exists (fallback)
        shell: pwsh
        run: |
          if (-not (Test-Path "packaging\dist\installer\IcarusEasyModSetup-*.exe")) {
            choco install innosetup -y --no-progress
            $version = (& python -c "import icarus_manager; print(icarus_manager.__version__)").Trim()
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "packaging\windows\installer.iss"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            packaging/dist/IcarusEasyMod-*-windows-x64.zip
            packaging/dist/installer/IcarusEasyModSetup-*.exe

  linux:
    name: Linux (portable tarball)
    runs-on: ubuntu-22.04
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Build
        run: PY="$(command -v python)" ./packaging/build_linux_native.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: packaging/dist/IcarusEasyMod-*-linux-x64.tar.gz

  macos:
    name: macOS (portable tarball)
    runs-on: macos-14
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Build
        run: PY="$(command -v python)" ./packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: packaging/dist/IcarusEasyMod-*-macos-*.tar.gz

  release:
    name: Publish versioned release
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version
        id: version
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' icarus_manager/__init__.py)
          if [ -z "$VERSION" ]; then
            echo "Could not read __version__ from icarus_manager/__init__.py"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Skip when this version was already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.skip == 'false'
        with:
          path: artifacts
      - name: Assemble assets and release notes
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release-assets/ \;
          cd release-assets && sha256sum * > SHA256SUMS.txt && cd ..

          VERSION="${{ steps.version.outputs.version }}"
          sed "s/{{VERSION}}/$VERSION/g" packaging/release_notes_template.md > release-notes.md
          PREV=$(git tag --sort=-v:refname | grep -v "^v$VERSION$" | head -1 || true)
          {
            echo ""
            echo "## Changes"
            echo ""
            if [ -n "$PREV" ]; then
              git log -n 50 "$PREV..HEAD" --no-merges --pretty="- %s"
            else
              git log -n 50 HEAD --no-merges --pretty="- %s"
            fi
          } >> release-notes.md
      - name: Publish release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$TAG" --title "Icarus Easy Mod $TAG" --notes-file release-notes.md release-assets/*
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Icarus Easy Mod $TAG" --notes-file release-notes.md release-assets/*
          fi
